<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --ink: #17243d;
    --muted: #5b6780;
    --line: #dde3ef;
    --accent: #2750d8;
    --accent-ink: #ffffff;
    --danger: #c0352b;
    --good: #1c7c54;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101626;
      --surface: #182036;
      --ink: #e8edf8;
      --muted: #97a3bd;
      --line: #2a3553;
      --accent: #6f8dff;
      --accent-ink: #0c1226;
      --danger: #ff7a70;
      --good: #4cc995;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.5;
  }
  header { padding: 28px 24px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.7rem; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 24px 48px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .stat span { color: var(--muted); font-size: .9rem; }
  .stat strong { display: block; font-size: 1.9rem; margin-top: 2px; }

  .bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .bar input[type=search] { flex: 1; min-width: 200px; }
  input, select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); padding: 9px 14px;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }

  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: .85rem; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.actions { display: flex; gap: 8px; }
  td.actions button { padding: 6px 12px; font-size: .9rem; }
  .grade { font-weight: 700; }
  .grade.pass { color: var(--good); }
  .grade.fail { color: var(--danger); }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); width: min(480px, 92vw); padding: 24px; }
  dialog::backdrop { background: rgba(10, 16, 32, .55); }
  dialog h2 { margin: 0 0 16px; font-size: 1.25rem; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .error { color: var(--danger); min-height: 1.4em; margin: 0 0 8px; font-size: .92rem; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
</style>
</head>
<body>
<header>
  <h1>Student Dashboard</h1>
  <p>Add, update and remove student records.</p>
</header>

<main>
  <section class="stats" aria-label="Summary">
    <div class="stat"><span>Total students</span><strong id="s-total">0</strong></div>
    <div class="stat"><span>Average grade</span><strong id="s-avg">0</strong></div>
    <div class="stat"><span>Highest grade</span><strong id="s-high">0</strong></div>
    <div class="stat"><span>Courses</span><strong id="s-courses">0</strong></div>
  </section>

  <div class="bar">
    <input type="search" id="search" placeholder="Search by name, student no. or course" aria-label="Search students">
    <button class="primary" id="add-btn">Add student</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Student no.</th><th>Name</th><th>Email</th><th>Course</th><th>Year</th><th>Grade</th><th>Actions</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No students yet. Select "Add student" to create the first record.</div>
  </div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlg-title">Add student</h2>
    <input type="hidden" id="id">
    <div class="field"><label for="student_no">Student no.</label><input id="student_no" required></div>
    <div class="field"><label for="name">Full name</label><input id="name" required></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
    <div class="field"><label for="course">Course</label><input id="course" required></div>
    <div class="row">
      <div class="field"><label for="year_level">Year level</label><input id="year_level" type="number" min="1" max="6" required></div>
      <div class="field"><label for="grade">Grade (0-100)</label><input id="grade" type="number" min="0" max="100" step="0.1" required></div>
    </div>
    <p class="error" id="error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="save">Save student</button>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const fields = ['student_no', 'name', 'email', 'course', 'year_level', 'grade'];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function api(url, options) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

async function loadStats() {
  const s = await api('/api/stats');
  $('s-total').textContent = s.total;
  $('s-avg').textContent = s.average ?? 0;
  $('s-high').textContent = s.highest ?? 0;
  $('s-courses').textContent = s.courses;
}

async function loadStudents() {
  const q = encodeURIComponent($('search').value);
  const list = await api('/api/students?q=' + q);
  $('rows').innerHTML = list.map(s => `
    <tr>
      <td>${esc(s.student_no)}</td>
      <td>${esc(s.name)}</td>
      <td>${esc(s.email)}</td>
      <td>${esc(s.course)}</td>
      <td>${s.year_level}</td>
      <td class="grade ${s.grade >= 75 ? 'pass' : 'fail'}">${s.grade}</td>
      <td class="actions">
        <button data-edit="${s.id}">Edit</button>
        <button class="danger" data-del="${s.id}">Delete</button>
      </td>
    </tr>`).join('');
  $('empty').hidden = list.length > 0;
}

function refresh() { return Promise.all([loadStudents(), loadStats()]); }

function openForm(student) {
  $('error').textContent = '';
  $('dlg-title').textContent = student ? 'Edit student' : 'Add student';
  $('id').value = student ? student.id : '';
  fields.forEach(f => { $(f).value = student ? student[f] : ''; });
  $('dlg').showModal();
}

$('add-btn').onclick = () => openForm(null);
$('cancel').onclick = () => $('dlg').close();
$('search').oninput = loadStudents;

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {};
  fields.forEach(f => { body[f] = $(f).value; });
  const id = $('id').value;
  try {
    await api(id ? '/api/students/' + id : '/api/students', {
      method: id ? 'PUT' : 'POST',
      body: JSON.stringify(body),
    });
    $('dlg').close();
    refresh();
  } catch (err) {
    $('error').textContent = err.message;
  }
});

$('rows').addEventListener('click', async e => {
  const editId = e.target.dataset.edit;
  const delId = e.target.dataset.del;
  if (editId) {
    openForm(await api('/api/students/' + editId));
  } else if (delId && confirm('Delete this student record?')) {
    await api('/api/students/' + delId, { method: 'DELETE' });
    refresh();
  }
});

refresh();
</script>
</body>
</html>
